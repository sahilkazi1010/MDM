<!DOCTYPE html>
<html>
<head>

    <title>jQuery Effects</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <style>

        body
        {
            font-family: Arial;
            text-align: center;
            background-color: lightgray;
        }

        .box
        {
            width: 300px;
            height: 150px;
            background-color: blue;
            color: white;
            margin: 30px auto;
            line-height: 150px;
            font-size: 25px;
        }

        button
        {
            padding: 10px;
            margin: 10px;
        }

    </style>

</head>

<body>

    <h2>jQuery Effects</h2>

    <button id="hide">
        Hide
    </button>

    <button id="show">
        Show
    </button>

    <button id="toggle">
        Toggle
    </button>

    <button id="animate">
        Animate
    </button>

    <div class="box">
        Hello
    </div>

    <script>

        $("#hide").click(function()
        {
            $(".box").hide();
        });

        $("#show").click(function()
        {
            $(".box").show();
        });

        $("#toggle").click(function()
        {
            $(".box").toggle();
        });

        $("#animate").click(function()
        {
            $(".box").animate(
            {
                width: '500px',
                height: '200px'
            });
        });

    </script>

</body>
</html>
