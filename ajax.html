<!DOCTYPE html>
<html>
<head>

    <title>AJAX Example</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>

</head>

<body>

    <h2>AJAX Fetch Data</h2>

    <button id="btn">
        Fetch Data
    </button>

    <table border="1" cellpadding="10">

        <tr>
            <th>Name</th>
            <th>Title</th>
            <th>Total</th>
        </tr>

        <tbody id="result">

        </tbody>

    </table>

    <script>

        $("#btn").click(function()
        {

            $.get(
            "http://172.16.5.154:4000/api/getAll/harshawar",

            function(data)
            {

                let rows = "";

                data.forEach(function(item)
                {

                    rows +=
                    "<tr>" +

                    "<td>" + item.Name + "</td>" +

                    "<td>" + item.Title + "</td>" +

                    "<td>" + item.Total + "</td>" +

                    "</tr>";

                });

                $("#result").html(rows);

            });

        });

    </script>

</body>
</html>
